name: Release (Production)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 #v1.4.1
        with:
          version: "2026.2.1"

  test:
    name: Test
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run tests
        run: |
          go test ./... -coverprofile coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
    permissions:
      contents: write
      packages: write
    env:
      CGO_ENABLED: 0
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: goreleaser/goreleaser-action@7ec5c2b0c6cdda6e8bbb49444bc797dd33d74dd8 #v3
        with:
          version: v0.170.0
          args: --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable experimental docker features
        run: |
          mkdir -p ~/.docker/ && \
          echo '{"experimental": "enabled"}' > ~/.docker/config.json
      - name: Create manifest for version
        run: |
          export DH_TAG=$(git tag --points-at HEAD | sed 's/^v*//')
          docker manifest create \
            ghcr.io/mfernandezfunes/watchtower:$DH_TAG \
            ghcr.io/mfernandezfunes/watchtower:amd64-$DH_TAG \
            ghcr.io/mfernandezfunes/watchtower:i386-$DH_TAG \
            ghcr.io/mfernandezfunes/watchtower:armhf-$DH_TAG \
            ghcr.io/mfernandezfunes/watchtower:arm64v8-$DH_TAG
      - name: Annotate manifest for version
        run: |
          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:$(echo $TAG | sed 's/^v*//') \
            ghcr.io/mfernandezfunes/watchtower:i386-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch 386

          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:$(echo $TAG | sed 's/^v*//') \
            ghcr.io/mfernandezfunes/watchtower:armhf-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch arm

          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:$(echo $TAG | sed 's/^v*//') \
            ghcr.io/mfernandezfunes/watchtower:arm64v8-$(echo $TAG | sed 's/^v*//') \
            --os linux \
            --arch arm64 \
            --variant v8
      - name: Create manifest for latest
        run: |
          docker manifest create \
            ghcr.io/mfernandezfunes/watchtower:latest \
            ghcr.io/mfernandezfunes/watchtower:amd64-latest \
            ghcr.io/mfernandezfunes/watchtower:i386-latest \
            ghcr.io/mfernandezfunes/watchtower:armhf-latest \
            ghcr.io/mfernandezfunes/watchtower:arm64v8-latest
      - name: Annotate manifest for latest
        run: |
          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:latest \
            ghcr.io/mfernandezfunes/watchtower:i386-latest \
            --os linux \
            --arch 386

          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:latest \
            ghcr.io/mfernandezfunes/watchtower:armhf-latest \
            --os linux \
            --arch arm

          docker manifest annotate \
            ghcr.io/mfernandezfunes/watchtower:latest \
            ghcr.io/mfernandezfunes/watchtower:arm64v8-latest \
            --os linux \
            --arch arm64 \
            --variant v8
      - name: Push manifests to GitHub Container Registry
        run: |
          docker manifest push ghcr.io/mfernandezfunes/watchtower:$(echo $TAG | sed 's/^v*//') && \
            docker manifest push ghcr.io/mfernandezfunes/watchtower:latest

  renew-docs:
    name: Refresh pkg.go.dev
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Pull new module version
      uses: andrewslotin/go-proxy-pull-action@50fea06a976087614babb9508e5c528b464f4645 #master@2022-10-14

  
  

  
